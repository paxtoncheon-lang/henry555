name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Init RDP
        run: |
          net user runneradmin "P@ssw0rd1qazXSW@#"
          cmd /c "netsh advfirewall firewall set rule group=\"remote desktop\" new enable=Yes"

      - name: 2. Setup Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "=========================================="
          Write-Host "Tailscale IP : $ts_ip"
          Write-Host "Username     : runneradmin"
          Write-Host "Password     : P@ssw0rd1qazXSW@#"
          Write-Host "=========================================="

      - name: 3. Keep Alive
        run: |
          for ($i = 1; $i -le 350; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "[$i/350] Server running..."
          }
